# Ambiente completo local. Nenhuma senha tem valor padrão: crie um arquivo .env
# na raiz (veja .env.example) antes de subir. `docker compose up --build`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }

  # Banco SÓ para testes (cluster separado: os testes redefinem as senhas dos papéis)
  postgres-test:
    image: postgres:16
    profiles: [test]
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    ports: ["127.0.0.1:5434:5432"]

  bootstrap:
    image: postgres:16
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
    volumes: [./scripts:/scripts:ro]
    command: >
      psql -h postgres -U postgres -v db=gestao360
      -v owner_pw=${DB_OWNER_PASSWORD:?} -v app_pw=${DB_APP_PASSWORD:?} -v platform_pw=${DB_PLATFORM_PASSWORD:?}
      -f /scripts/db-bootstrap.sql

  migrate:
    build: ./apps/api
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    environment:
      DATABASE_OWNER_URL: postgres://g360_owner:${DB_OWNER_PASSWORD:?}@postgres:5432/gestao360
    command: ["npx", "tsx", "src/db/migrate.ts"]

  api: &api
    build: ./apps/api
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment: &apienv
      # Sem default: o ambiente precisa ser escolhido explicitamente no .env
      NODE_ENV: ${NODE_ENV:?defina NODE_ENV no .env (development ou production)}
      API_SURFACE: tenant
      # Proxies na frente da API: 1 = nginx do serviço web (local). Na VPS o override usa 2 (Caddy + nginx)
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_APP_URL: postgres://g360_app:${DB_APP_PASSWORD:?}@postgres:5432/gestao360
      # A API pública NÃO recebe DATABASE_PLATFORM_URL (BYPASSRLS): o webhook usa a função record_billing_webhook
      BILLING_PROVIDER: ${BILLING_PROVIDER:?defina BILLING_PROVIDER no .env (fake ou stripe)}
      # Simulador de pagamento: desligado salvo pedido explícito (só vale com development + fake)
      ENABLE_FAKE_CHECKOUT: ${ENABLE_FAKE_CHECKOUT:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?defina no .env}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      # Campanhas: cifra os tokens de Resend/Meta/Zenvia de cada cliente (openssl rand -hex 32).
      # Sem ela, a tela Canais avisa "servidor não pronto" e nenhum token é gravado.
      CHANNEL_SECRETS_KEY: ${CHANNEL_SECRETS_KEY:-}
      # live = envia de verdade; fake = simula (só aceito com NODE_ENV=development)
      MESSAGING_MODE: ${MESSAGING_MODE:-live}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}

  api-platform:
    <<: *api
    environment:
      <<: *apienv
      API_SURFACE: platform
      DATABASE_PLATFORM_URL: postgres://g360_platform:${DB_PLATFORM_PASSWORD:?}@postgres:5432/gestao360
      PLATFORM_MFA_KEY: ${PLATFORM_MFA_KEY:?defina PLATFORM_MFA_KEY no .env}

  worker:
    <<: *api
    environment:
      <<: *apienv
      DATABASE_PLATFORM_URL: postgres://g360_platform:${DB_PLATFORM_PASSWORD:?}@postgres:5432/gestao360
    command: ["npx", "tsx", "src/worker.ts"]

  web:
    build: ./apps/web
    depends_on: [api, api-platform]
    # Só na máquina local; na VPS quem fica exposto é o Caddy (docker-compose.prod.yml)
    ports: ["127.0.0.1:8080:80"]

volumes:
  pgdata:
