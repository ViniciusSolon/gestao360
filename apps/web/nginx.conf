server {
  listen 80;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Painel interno: em produção, sirva em host separado protegido por VPN/SSO.
  location /api/platform/ { proxy_pass http://api-platform:3333; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; }
  location /api/          { proxy_pass http://api:3333;          proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
